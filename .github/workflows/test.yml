name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings tests/ASTral.Tests/.runsettings --results-directory ./TestResults

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./TestResults/**/coverage.cobertura.xml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./nupkg

      # Trusted Publishing: exchanges the OIDC token (needs `id-token: write` above) for a NuGet
      # key valid ~1 hour, so no long-lived secret is stored. Keep it adjacent to the push so the
      # key cannot expire in between. Requires a Trusted Publishing policy on nuget.org for
      # `Atypical.ASTral` naming this repository and `test.yml`, plus the NUGET_USER secret.
      # Deliberately UNGUARDED: this job only runs on a v* tag, so a release is expected. A
      # missing policy must fail loudly rather than skip and leave the tagged version unpublished
      # behind a green check.
      - name: NuGet login (OIDC -> short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
